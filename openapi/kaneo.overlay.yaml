overlay: 1.0.0
info:
  title: Kaneo client generation fixes
  version: 1.0.0
actions:
  - target: $.components.schemas['Task','BoardTask'].properties.position.type
    description: Replace the nullable floating-point task position type.
    remove: true
  - target: $.components.schemas['Task','BoardTask'].properties.position
    description: Task positions are nullable PostgreSQL integers.
    update:
      type: [integer, 'null']
      format: int32
  - target: $.components.schemas['Task','BoardTask'].properties.number.type
    description: Replace the nullable floating-point task number type.
    remove: true
  - target: $.components.schemas['Task','BoardTask'].properties.number
    description: Task numbers are nullable PostgreSQL integers.
    update:
      type: [integer, 'null']
      format: int32
  - target: $.paths['/task/{id}'].put.requestBody.content['application/json'].schema.properties.position
    description: Task updates write the same integer position.
    update:
      type: integer
      format: int32
  - target: $.components.schemas.Column.properties.position
    description: Column positions are stored as PostgreSQL integers, not floating-point numbers.
    update:
      type: integer
      format: int32
  - target: $.paths['/column/reorder/{projectId}'].put.requestBody.content['application/json'].schema.properties.columns.items.properties.position
    description: Reordering writes the same integer column position.
    update:
      type: integer
      format: int32
  - target: $.paths['/notification'].post.responses['200'].content['application/json'].schema.allOf
    description: Remove the invalid intersection used to express a nullable response.
    remove: true
  - target: $.paths['/notification'].post.responses['200'].content['application/json'].schema
    description: Express the nullable notification response as a union.
    update:
      anyOf:
        - $ref: '#/components/schemas/Notification'
        - type: 'null'
  - target: $.components.schemas
    description: Define the workspace returned by Better Auth organization endpoints.
    update:
      Workspace:
        type: object
        required:
          - id
          - name
          - slug
          - createdAt
        properties:
          id:
            type: string
          name:
            type: string
          slug:
            type: string
          logo:
            type:
              - string
              - 'null'
          metadata:
            anyOf:
              - type: object
                additionalProperties: true
              - type: 'null'
          description:
            type:
              - string
              - 'null'
          createdAt:
            type: string
            format: date-time
  - target: $.paths['/auth/organization/create'].post.responses['200'].content['application/json'].schema
    description: Type the workspace returned after creation.
    update:
      $ref: '#/components/schemas/Workspace'
  - target: $.paths['/auth/organization/update'].post.responses['200'].content['application/json'].schema
    description: Type the workspace returned after an update.
    update:
      $ref: '#/components/schemas/Workspace'
  - target: $.paths['/auth/organization/delete'].post.responses['200'].content['application/json'].schema.type
    description: The delete endpoint returns the deleted workspace, not a string.
    remove: true
  - target: $.paths['/auth/organization/delete'].post.responses['200'].content['application/json'].schema
    description: Type the workspace returned after deletion.
    update:
      $ref: '#/components/schemas/Workspace'
  - target: $.paths['/auth/organization/list'].get.responses['200'].content['application/json'].schema.items
    description: Type each workspace returned by the organization list endpoint.
    update:
      $ref: '#/components/schemas/Workspace'
  - target: $.paths
    description: Include the separately maintained Better Auth admin operations.
    update:
      /auth/admin/create-user:
        $ref: './kaneo.admin.openapi.yaml#/paths/~1auth~1admin~1create-user'
      /auth/admin/get-user:
        $ref: './kaneo.admin.openapi.yaml#/paths/~1auth~1admin~1get-user'
      /auth/admin/update-user:
        $ref: './kaneo.admin.openapi.yaml#/paths/~1auth~1admin~1update-user'
      /auth/admin/remove-user:
        $ref: './kaneo.admin.openapi.yaml#/paths/~1auth~1admin~1remove-user'
      /auth/admin/set-user-password:
        $ref: './kaneo.admin.openapi.yaml#/paths/~1auth~1admin~1set-user-password'

  - target: $.components.schemas
    description: Dynamic role wire responses from Better Auth 1.6.25 crud-access-control.mjs. Permissions are objects, not serialized JSON.
    update:
      WorkspaceRole:
        type: object
        required:
        - id
        - organizationId
        - role
        - permission
        properties:
          id:
            type: string
          organizationId:
            type: string
          role:
            type: string
          permission:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
      WorkspaceRoleResult:
        type: object
        required:
        - success
        - roleData
        properties:
          success:
            type: boolean
          roleData:
            "$ref": "#/components/schemas/WorkspaceRole"
      WorkspaceRoleUpdate:
        type: object
        required: []
        properties:
          permission:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
          roleName:
            type: string
      WorkspaceRoleSuccess:
        type: object
        required:
        - success
        properties:
          success:
            type: boolean
  - target: $.paths['/auth/organization/create-role']
    remove: true
  - target: $.paths['/auth/organization/get-role']
    remove: true
  - target: $.paths['/auth/organization/update-role']
    remove: true
  - target: $.paths['/auth/organization/delete-role']
    remove: true
  - target: $.paths['/auth/organization/list-roles']
    remove: true
  - target: $.paths['/auth/organization/get-full-organization']
    remove: true
  - target: $.paths
    description: Explicit workspace queries and ID-based role CRUD. Full organization returns ORGANIZATION_NOT_FOUND before membership checks, unlike the membership-only list.
    update:
      "/auth/organization/create-role":
        post:
          operationId: createWorkspaceRole
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                  - organizationId
                  - role
                  - permission
                  properties:
                    organizationId:
                      type: string
                    role:
                      type: string
                    permission:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    "$ref": "#/components/schemas/WorkspaceRoleResult"
      "/auth/organization/get-role":
        get:
          operationId: getWorkspaceRole
          parameters:
          - name: organizationId
            in: query
            required: true
            schema:
              type: string
          - name: roleId
            in: query
            required: true
            schema:
              type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    "$ref": "#/components/schemas/WorkspaceRole"
      "/auth/organization/update-role":
        post:
          operationId: updateWorkspaceRole
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                  - organizationId
                  - roleId
                  - data
                  properties:
                    organizationId:
                      type: string
                    roleId:
                      type: string
                    data:
                      "$ref": "#/components/schemas/WorkspaceRoleUpdate"
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    "$ref": "#/components/schemas/WorkspaceRoleResult"
      "/auth/organization/delete-role":
        post:
          operationId: deleteWorkspaceRole
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                  - organizationId
                  - roleId
                  properties:
                    organizationId:
                      type: string
                    roleId:
                      type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    "$ref": "#/components/schemas/WorkspaceRoleSuccess"
      "/auth/organization/list-roles":
        get:
          operationId: listWorkspaceRoles
          parameters:
          - name: organizationId
            in: query
            required: true
            schema:
              type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WorkspaceRole"
      "/auth/organization/get-full-organization":
        get:
          operationId: getWorkspacePresence
          parameters:
          - name: organizationId
            in: query
            required: true
            schema:
              type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
  - target: $.components.schemas
    description: Better Auth 1.6.25 membership wire shapes. Mutations return bare members or invitations except remove-member.
    update:
      WorkspaceMembershipMember:
        type: object
        required: [id, organizationId, userId, role]
        properties:
          id: {type: string}
          organizationId: {type: string}
          userId: {type: string}
          role: {type: string}
          user:
            type: object
            required: [id, email]
            properties:
              id: {type: string}
              email: {type: string}
      WorkspaceInvitation:
        type: object
        required: [id, organizationId, email, status, expiresAt]
        properties:
          id: {type: string}
          organizationId: {type: string}
          email: {type: string}
          role: {type: [string, 'null']}
          status: {type: string}
          expiresAt: {type: string, format: date-time}
  - target: $.paths['/auth/organization/list-members'].get
    update:
      parameters:
        - {name: organizationId, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: offset, in: query, required: true, schema: {type: integer, minimum: 0}}
        - {name: sortBy, in: query, required: true, schema: {type: string}}
        - {name: sortDirection, in: query, required: true, schema: {type: string, enum: [asc, desc], x-enum-varnames: [MemberSortAscending, MemberSortDescending]}}
      responses:
        '200':
          description: Paginated members with joined users; total counts all pages.
          content:
            application/json:
              schema:
                type: object
                required: [members, total]
                properties:
                  members: {type: array, items: {$ref: '#/components/schemas/WorkspaceMembershipMember'}}
                  # Keep a pointer to reject a missing required total at runtime.
                  total: {type: integer, minimum: 0, x-go-type: '*int'}
  - target: $.paths['/auth/organization/list-invitations'].get
    update:
      parameters:
        - {name: organizationId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: Bare invitation array, capped at 100 stored rows without pagination.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/WorkspaceInvitation'}}
  - target: $.paths['/auth/organization/update-member-role'].post.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/auth/organization/invite-member'].post.responses['200'].content['application/json'].schema
    remove: true
  - target: $.paths['/auth/organization/update-member-role'].post.responses['200'].content['application/json']
    update:
      schema: {$ref: '#/components/schemas/WorkspaceMembershipMember'}
  - target: $.paths['/auth/organization/invite-member'].post.responses['200'].content['application/json']
    update:
      schema: {$ref: '#/components/schemas/WorkspaceInvitation'}
  - target: $.paths['/auth/organization/cancel-invitation'].post.responses['200']
    update:
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkspaceInvitation'}
