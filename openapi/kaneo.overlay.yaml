overlay: 1.0.0
info:
  title: Kaneo client generation fixes
  version: 1.0.0
actions:
  - target: $.components.schemas['Task','BoardTask'].properties.position.type
    description: Replace the nullable floating-point task position type.
    remove: true
  - target: $.components.schemas['Task','BoardTask'].properties.position
    description: Task positions are nullable PostgreSQL integers.
    update:
      type: [integer, 'null']
      format: int32
  - target: $.components.schemas['Task','BoardTask'].properties.number.type
    description: Replace the nullable floating-point task number type.
    remove: true
  - target: $.components.schemas['Task','BoardTask'].properties.number
    description: Task numbers are nullable PostgreSQL integers.
    update:
      type: [integer, 'null']
      format: int32
  - target: $.paths['/task/{id}'].put.requestBody.content['application/json'].schema.properties.position
    description: Task updates write the same integer position.
    update:
      type: integer
      format: int32
  - target: $.components.schemas.Column.properties.position
    description: Column positions are stored as PostgreSQL integers, not floating-point numbers.
    update:
      type: integer
      format: int32
  - target: $.paths['/column/reorder/{projectId}'].put.requestBody.content['application/json'].schema.properties.columns.items.properties.position
    description: Reordering writes the same integer column position.
    update:
      type: integer
      format: int32
  - target: $.paths['/notification'].post.responses['200'].content['application/json'].schema.allOf
    description: Remove the invalid intersection used to express a nullable response.
    remove: true
  - target: $.paths['/notification'].post.responses['200'].content['application/json'].schema
    description: Express the nullable notification response as a union.
    update:
      anyOf:
        - $ref: '#/components/schemas/Notification'
        - type: 'null'
  - target: $.components.schemas
    description: Define the workspace returned by Better Auth organization endpoints.
    update:
      Workspace:
        type: object
        required:
          - id
          - name
          - slug
          - createdAt
        properties:
          id:
            type: string
          name:
            type: string
          slug:
            type: string
          logo:
            type:
              - string
              - 'null'
          metadata:
            anyOf:
              - type: object
                additionalProperties: true
              - type: 'null'
          description:
            type:
              - string
              - 'null'
          createdAt:
            type: string
            format: date-time
  - target: $.paths['/auth/organization/create'].post.responses['200'].content['application/json'].schema
    description: Type the workspace returned after creation.
    update:
      $ref: '#/components/schemas/Workspace'
  - target: $.paths['/auth/organization/update'].post.responses['200'].content['application/json'].schema
    description: Type the workspace returned after an update.
    update:
      $ref: '#/components/schemas/Workspace'
  - target: $.paths['/auth/organization/delete'].post.responses['200'].content['application/json'].schema.type
    description: The delete endpoint returns the deleted workspace, not a string.
    remove: true
  - target: $.paths['/auth/organization/delete'].post.responses['200'].content['application/json'].schema
    description: Type the workspace returned after deletion.
    update:
      $ref: '#/components/schemas/Workspace'
  - target: $.paths['/auth/organization/list'].get.responses['200'].content['application/json'].schema.items
    description: Type each workspace returned by the organization list endpoint.
    update:
      $ref: '#/components/schemas/Workspace'
  - target: $.components.schemas
    description: Better Auth 1.6.25 admin user fields used by the provider. Passwords are never returned.
    update:
      AdminUser:
        type: object
        required: [id, email, name, role, emailVerified]
        properties:
          id: {type: string}
          email: {type: string}
          name: {type: string}
          role: {type: string}
          emailVerified: {type: boolean}
      AdminUserData:
        type: object
        required: [email, name, role, emailVerified]
        properties:
          email: {type: string}
          name: {type: string}
          role: {type: string}
          emailVerified: {type: boolean}
  - target: $.paths
    description: >-
      Admin endpoints from Better Auth 1.6.25, used by Kaneo 2.23.2.
      The live auth schema omits required flags and incorrectly wraps get/update
      responses in user. routes.mjs returns those users directly. Missing users
      return 404; permission failures return 403. Keep the pinned Kaneo spec intact.
    update:
      /auth/admin/create-user:
        post:
          operationId: createAdminUser
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [email, name, role, data]
                  properties:
                    email: {type: string}
                    name: {type: string}
                    role: {type: string}
                    data:
                      type: object
                      required: [emailVerified]
                      properties:
                        emailVerified: {type: boolean}
          responses:
            '200':
              description: Created user
              content:
                application/json:
                  schema:
                    type: object
                    required: [user]
                    properties:
                      user: {$ref: '#/components/schemas/AdminUser'}
      /auth/admin/get-user:
        get:
          operationId: getAdminUser
          parameters:
            - name: id
              in: query
              required: true
              schema: {type: string}
          responses:
            '200':
              description: User
              content:
                application/json:
                  schema: {$ref: '#/components/schemas/AdminUser'}
      /auth/admin/update-user:
        post:
          operationId: updateAdminUser
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [userId, data]
                  properties:
                    userId: {type: string}
                    data: {$ref: '#/components/schemas/AdminUserData'}
          responses:
            '200':
              description: Updated user
              content:
                application/json:
                  schema: {$ref: '#/components/schemas/AdminUser'}
      /auth/admin/remove-user:
        post:
          operationId: removeAdminUser
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [userId]
                  properties:
                    userId: {type: string}
          responses:
            '200':
              description: User removed
              content:
                application/json:
                  schema:
                    type: object
                    required: [success]
                    properties:
                      success: {type: boolean}
      /auth/admin/set-user-password:
        post:
          operationId: setAdminUserPassword
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required: [userId, newPassword]
                  properties:
                    userId: {type: string}
                    newPassword: {type: string}
          responses:
            '200':
              description: Password set
              content:
                application/json:
                  schema:
                    type: object
                    required: [status]
                    properties:
                      status: {type: boolean}

  - target: $.components.schemas
    description: Dynamic role wire responses from Better Auth 1.6.25 crud-access-control.mjs. Permissions are objects, not serialized JSON.
    update:
      WorkspaceRole:
        type: object
        required:
        - id
        - organizationId
        - role
        - permission
        properties:
          id:
            type: string
          organizationId:
            type: string
          role:
            type: string
          permission:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
      WorkspaceRoleResult:
        type: object
        required:
        - success
        - roleData
        properties:
          success:
            type: boolean
          roleData:
            "$ref": "#/components/schemas/WorkspaceRole"
      WorkspaceRoleUpdate:
        type: object
        required: []
        properties:
          permission:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
          roleName:
            type: string
      WorkspaceRoleSuccess:
        type: object
        required:
        - success
        properties:
          success:
            type: boolean
  - target: $.paths['/auth/organization/create-role']
    remove: true
  - target: $.paths['/auth/organization/get-role']
    remove: true
  - target: $.paths['/auth/organization/update-role']
    remove: true
  - target: $.paths['/auth/organization/delete-role']
    remove: true
  - target: $.paths['/auth/organization/list-roles']
    remove: true
  - target: $.paths['/auth/organization/get-full-organization']
    remove: true
  - target: $.paths
    description: Explicit workspace queries and ID-based role CRUD. Full organization returns ORGANIZATION_NOT_FOUND before membership checks, unlike the membership-only list.
    update:
      "/auth/organization/create-role":
        post:
          operationId: createWorkspaceRole
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                  - organizationId
                  - role
                  - permission
                  properties:
                    organizationId:
                      type: string
                    role:
                      type: string
                    permission:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    "$ref": "#/components/schemas/WorkspaceRoleResult"
      "/auth/organization/get-role":
        get:
          operationId: getWorkspaceRole
          parameters:
          - name: organizationId
            in: query
            required: true
            schema:
              type: string
          - name: roleId
            in: query
            required: true
            schema:
              type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    "$ref": "#/components/schemas/WorkspaceRole"
      "/auth/organization/update-role":
        post:
          operationId: updateWorkspaceRole
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                  - organizationId
                  - roleId
                  - data
                  properties:
                    organizationId:
                      type: string
                    roleId:
                      type: string
                    data:
                      "$ref": "#/components/schemas/WorkspaceRoleUpdate"
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    "$ref": "#/components/schemas/WorkspaceRoleResult"
      "/auth/organization/delete-role":
        post:
          operationId: deleteWorkspaceRole
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                  - organizationId
                  - roleId
                  properties:
                    organizationId:
                      type: string
                    roleId:
                      type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    "$ref": "#/components/schemas/WorkspaceRoleSuccess"
      "/auth/organization/list-roles":
        get:
          operationId: listWorkspaceRoles
          parameters:
          - name: organizationId
            in: query
            required: true
            schema:
              type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WorkspaceRole"
      "/auth/organization/get-full-organization":
        get:
          operationId: getWorkspacePresence
          parameters:
          - name: organizationId
            in: query
            required: true
            schema:
              type: string
          responses:
            '200':
              description: Better Auth 1.6.25 response
              content:
                application/json:
                  schema:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
