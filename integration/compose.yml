services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaneo
      POSTGRES_USER: kaneo
      POSTGRES_PASSWORD: acceptance-test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 2s
      timeout: 5s
      retries: 30

  kaneo:
    image: ghcr.io/usekaneo/kaneo:${KANEO_VERSION:-2.23.2}
    ports:
      - "127.0.0.1:${KANEO_TEST_PORT:-5173}:5173"
    environment:
      DATABASE_URL: postgresql://kaneo:acceptance-test-password@postgres:5432/kaneo
      KANEO_CLIENT_URL: http://localhost:${KANEO_TEST_PORT:-5173}
      KANEO_API_URL: http://localhost:${KANEO_TEST_PORT:-5173}/api
      AUTH_SECRET: acceptance-test-secret-not-for-production-1234567890
      KANEO_CLOUD: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 60
