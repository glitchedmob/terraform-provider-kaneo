name: Acceptance tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Kaneo ${{ matrix.kaneo-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kaneo-version:
          - "2.23.2"
    env:
      KANEO_VERSION: ${{ matrix.kaneo-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false
      - run: make testacc
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: kaneo-${{ matrix.kaneo-version }}-logs
          path: _artifacts
          if-no-files-found: ignore
